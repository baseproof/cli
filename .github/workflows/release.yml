name: release

# Tag vX.Y.Z → build the static binaries for every supported platform
# (linux/darwin, amd64 + arm64, windows), the shell completions and man pages,
# checksum everything, and publish a GitHub release. `make install` from source
# remains the dev path; these artifacts are what a package manager (e.g. a
# Homebrew tap formula) points at.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GOPRIVATE: github.com/baseproof/*
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: git auth for private baseproof modules (no-op without the secret)
        env:
          TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/baseproof/".insteadOf "https://github.com/baseproof/"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: go.sum
      - name: build release artifacts (version = the tag)
        run: make cross completions man VERSION=${{ github.ref_name }}
      - name: package completions + man, checksum everything
        run: |
          tar -czf dist/baseproof-completions-man.tar.gz completions man
          cd dist && sha256sum * > checksums.txt
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "baseproof ${{ github.ref_name }}" --generate-notes
