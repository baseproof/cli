name: release

# Tag vX.Y.Z → GoReleaser builds the static binaries for every supported
# platform (linux/darwin, amd64 + arm64, windows), archives them with the
# completions + man pages + LICENSE, checksums everything, publishes the
# GitHub release, and pushes the updated Homebrew formula to
# baseproof/homebrew-tap.
#
# Secrets (both optional):
#   GO_MODULES_TOKEN    read access to private baseproof modules, if the
#                       runner can't fetch them anonymously
#   HOMEBREW_TAP_TOKEN  write access to baseproof/homebrew-tap; absent ⇒ the
#                       formula is generated into dist/ but not pushed

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GOPRIVATE: github.com/baseproof/*
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the full history + tags
      - name: git auth for private baseproof modules (no-op without the secret)
        env:
          TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/baseproof/".insteadOf "https://github.com/baseproof/"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
