name: ci

# The solidity gate for the baseproof binary: gofmt + vet + test + build on
# linux AND macos, then prove every release target (linux/darwin, amd64+arm64,
# windows) cross-compiles and the install artifacts (completions, man pages)
# generate. CGO is off (Makefile), so the binaries are static and portable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/baseproof/*
  GOTOOLCHAIN: local # honor the go.mod version; never auto-download a toolchain

jobs:
  verify:
    name: check · build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: git auth for private baseproof modules (no-op without the secret)
        env:
          TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/baseproof/".insteadOf "https://github.com/baseproof/"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: go.sum
      - run: make check
      - run: make build
      - run: ./bin/baseproof --version

  artifacts:
    # The release pipeline itself, dry-run: GoReleaser snapshot exercises the
    # before hooks (completions + man), the full cross matrix, the archives and
    # the Homebrew formula template on every push — so a tag can't surprise us.
    name: release pipeline (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git auth for private baseproof modules (no-op without the secret)
        env:
          TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/baseproof/".insteadOf "https://github.com/baseproof/"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # --skip=sign: Sigstore keyless signing needs the RELEASE workflow's
          # OIDC identity; a snapshot has nothing meaningful to sign for.
          args: release --snapshot --clean --skip=sign
        env:
          HOMEBREW_TAP_TOKEN: ""
      - uses: actions/upload-artifact@v4
        with:
          name: baseproof-dist
          path: dist/
